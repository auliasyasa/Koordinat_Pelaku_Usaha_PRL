<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebGIS - Pelaku Usaha (Google Sheet)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #f3f4f6;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.18);
      min-width: 260px;
      max-width: 320px;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .controls strong {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .controls input,
    .controls select,
    .controls button {
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0;
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
    }

    .controls button {
      background: #e5e7eb;
      cursor: pointer;
      font-weight: 600;
    }

    .controls button:hover {
      background: #dfe3ea;
    }

    .small {
      margin-top: 6px;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="controls" id="controls">
    <strong>Filter / Pencarian</strong>
    <input id="searchText" placeholder="Cari nama atau alamat..." />
    <select id="categorySelect">
      <option value="">Semua Kategori</option>
    </select>
    <button id="applyBtn">Terapkan</button>
    <button id="resetBtn">Reset & Zoom</button>
    <div class="small">Pastikan sheet sudah di-publish (File → Publish to web → CSV).</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const SHEET_ID = '19XvPDOvnKFobzk45LnqKwvbeAMoxT0N3ob0cLqYPT4k';
    const GID = '0';
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    const map = L.map('map').setView([-6.2, 106.8], 11);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
    });

    osm.addTo(map);

    const baseMaps = {
      'OpenStreetMap': osm,
      'Satelit (Esri)': esriSat
    };

    L.control.layers(baseMaps).addTo(map);

    const markersCluster = L.markerClusterGroup();
    let allData = [];

    function firstDefined(obj, keys) {
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(obj, key) &&
            obj[key] !== undefined &&
            obj[key] !== null &&
            String(obj[key]).trim() !== '') {
          return obj[key];
        }
      }
      return null;
    }

    function parseNumberFlexible(raw) {
      if (raw === undefined || raw === null) return NaN;
      const s = String(raw).trim().replace(/\s+/g, '').replace(/,/g, '.');
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function normalizeStatus(value) {
      const s = String(value || '').trim();
      if (!s) return '';
      const low = s.toLowerCase();
      if (low.includes('sudah')) return 'Sudah diawasi';
      if (low.includes('belum')) return 'Belum diawasi';
      return s;
    }

    function processRows(rows) {
      allData = [];

      rows.forEach((row, idx) => {
        const latRaw = firstDefined(row, ['LAT', 'Lat', 'lat', 'latitude', 'Latitude']);
        const lngRaw = firstDefined(row, ['LONG', 'Long', 'long', 'longitude', 'Longitude']);
        const name = firstDefined(row, ['PELAKU USAHA', 'PELAKU_USAHA', 'pelaku_usaha', 'NAMA', 'nama', 'name']) || `Lokasi ${idx + 1}`;
        const addr = firstDefined(row, ['LOKASI', 'lokasi', 'ALAMAT', 'alamat', 'address']) || '';
        const category = firstDefined(row, ['UPT PSDKP', 'UPT_PSDKP', 'UPT', 'upt']) || '';
        const status = normalizeStatus(firstDefined(row, ['TL PENGAWASAN', 'TL_PENGAWASAN', 'TL pengawasan', 'TL_pengawasan', 'TL']));

        const lat = parseNumberFlexible(latRaw);
        const lng = parseNumberFlexible(lngRaw);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        allData.push({
          lat,
          lng,
          name,
          addr,
          category,
          status,
          raw: row
        });
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.toString()
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderMarkers(filterText = '', filterCategory = '') {
      markersCluster.clearLayers();
      const ft = (filterText || '').toLowerCase().trim();
      const fc = (filterCategory || '').toLowerCase().trim();
      const bounds = [];

      allData.forEach((d) => {
        const matchesText = !ft || (d.name && d.name.toLowerCase().includes(ft)) || (d.addr && d.addr.toLowerCase().includes(ft));
        const matchesCat = !fc || (d.category && d.category.toLowerCase() === fc);

        if (matchesText && matchesCat) {
          const popup = `
            <strong>${escapeHtml(d.name)}</strong><br/>
            ${escapeHtml(d.addr)}
            ${d.category ? '<br/><em>' + escapeHtml(d.category) + '</em>' : ''}
            ${d.status ? '<br/>TL Pengawasan: ' + escapeHtml(d.status) : ''}
          `;

          const m = L.marker([d.lat, d.lng]);
          m.bindPopup(popup);
          markersCluster.addLayer(m);
          bounds.push([d.lat, d.lng]);
        }
      });

      map.addLayer(markersCluster);

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    function populateCategorySelect() {
      const sel = document.getElementById('categorySelect');
      sel.innerHTML = '<option value="">Semua Kategori</option>';

      const cats = Array.from(new Set(
        allData.map(d => (d.category || '').trim()).filter(Boolean)
      )).sort();

      cats.forEach((c) => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    document.getElementById('applyBtn').addEventListener('click', () => {
      const txt = document.getElementById('searchText').value;
      const cat = document.getElementById('categorySelect').value;
      renderMarkers(txt, cat);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchText').value = '';
      document.getElementById('categorySelect').value = '';
      renderMarkers();

      if (allData.length) {
        const bounds = allData.map(d => [d.lat, d.lng]);
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    });

    Papa.parse(sheetUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        console.log('CSV fields:', results.meta.fields);
        console.log('First row:', results.data[0]);

        const rows = results.data || [];
        processRows(rows);
        populateCategorySelect();
        renderMarkers();

        if (allData.length) {
          const bounds = allData.map(d => [d.lat, d.lng]);
          map.fitBounds(bounds, { padding: [30, 30] });
        } else {
          console.warn('Tidak ada koordinat valid ditemukan. Cek header LONG/LAT serta publish CSV.');
        }
      },
      error: function(err) {
        console.error('Gagal memuat sheet:', err);
        alert('Gagal memuat data. Pastikan sheet sudah di-publish (File → Publish to web) dan SHEET_ID/GID benar.');
      }
    });
  </script>
</body>
</html>
